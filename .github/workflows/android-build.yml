name: Viora Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="viora-android-starter.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP dosyasi bulunamadi!"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          PROJECT_DIR=""

          while IFS= read -r file; do
            dir="$(dirname "$file")"

            if [ -d "$dir/app" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(find extracted -name settings.gradle.kts)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android proje klasoru bulunamadi!"
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .
          test -d app

      - name: Fix Google Authorization dependency
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          dependency = '    implementation("com.google.android.gms:play-services-auth:22.0.0")'

          lines = s.splitlines()
          found = False

          for i, line in enumerate(lines):
              if "com.google.android.gms:play-services-auth:" in line:
                  lines[i] = dependency
                  found = True

          s = "\n".join(lines)

          if not found:
              match = re.search(r'(?m)^dependencies\s*\{', s)
              if not match:
                  raise SystemExit("dependencies bloğu bulunamadı!")
              pos = match.end()
              s = s[:pos] + "\n" + dependency + s[pos:]

          p.write_text(s + "\n")
          print("Google Authorization dependency ayarlandi.")
          PY

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager bulunamadi!"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Viora APK
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          gradle --no-daemon :app:assembleDebug \
            -PYOUTUBE_API_KEY="$YOUTUBE_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Viora-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
